name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-title:
    name: conventional-title
    runs-on: ubuntu-latest
    steps:
      - name: Check that the title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9-]*\))?!?: [a-z0-9](.*[^. ])?$'
          if printf '%s' "$TITLE" | grep -Eq "$PATTERN"; then
            echo "OK: $TITLE"
            exit 0
          fi
          echo "::error::The pull request title must follow Conventional Commits, for example \"feat(watchlist): add a column\". Got: $TITLE"
          exit 1
